<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Rounded square background -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#bg)" />
  
  <!-- Stylized M letter -->
  <path d="M12 34V18l6 8 6-8v16" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- AI dot / speech indicator -->
  <circle cx="34" cy="16" r="4" fill="url(#dot)" />
  <circle cx="34" cy="16" r="6" fill="none" stroke="url(#ring)" stroke-width="1.5" opacity="0.6" />
  <circle cx="34" cy="16" r="9" fill="none" stroke="url(#ring)" stroke-width="1" opacity="0.3" />
  
  <!-- Interview lines -->
  <line x1="30" y1="26" x2="38" y2="26" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="30" y1="31" x2="36" y2="31" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="30" y1="36" x2="34" y2="36" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="48" y2="48">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="dot" x1="30" y1="12" x2="38" y2="20">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="ring" x1="28" y1="10" x2="40" y2="22">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#60a5fa"/>
